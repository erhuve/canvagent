<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Canvagent</title><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="stylesheet" href="launcher.css"><script src="launcher.js" defer></script></head>
<body>
  <main>
    <div class="mark" aria-hidden="true"><img src="mark.svg" width="42" height="42" alt=""></div>
    <p class="eyebrow">CANVAGENT</p>
    <h1>A shared space to build.</h1>
    <p class="description">Choose a project folder to start a conversation<br>and open your shared canvas.</p>
    <button id="choose">Open a workspace <span>↗</span></button>
    <button id="recent" class="recent" hidden><span>Continue where you left off</span><strong id="recent-name"></strong><small id="recent-path"></small></button>
    <p id="status" role="status">Your projects and canvas stay on this machine.</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer>Local workspace <span>·</span> Codex <span>·</span> Excalidraw</footer>
</body>
</html>
